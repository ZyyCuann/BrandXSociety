<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrandxSociety - Live Interactive Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #7F1110;
      --primary-dark: #580B0A;
      --secondary: #FCDB00;
      --secondary-hover: #e5c700;
      --accent: #280605;
      --neutral: #FFFFFF;
      --bg: #fffaf4;
      --card-bg: #FFFFFF;
      --soft: #fff3d0;
      --soft-red: #fff0ef;
      --line: rgba(127, 17, 16, .16);
      --line-subtle: #f0dfd9;
      --muted: #7b6765;
      --ink: #280605;
      --shadow: 0 18px 50px rgba(40, 6, 5, .12);
      --card-shadow: 0 8px 24px rgba(40, 6, 5, .06);
      --success: #1b873f;
      --success-bg: #eafaf1;
    }

    * {
      box-sizing: border-box;
      /* Completely eliminate browser scrollbars and scrolling buttons */
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    *::-webkit-scrollbar,
    *::-webkit-scrollbar-button,
    *::-webkit-scrollbar-track,
    *::-webkit-scrollbar-thumb {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background:
        radial-gradient(circle at 10% 15%, rgba(252, 219, 0, .10), transparent 25%),
        radial-gradient(circle at 90% 85%, rgba(127, 17, 16, .08), transparent 30%),
        linear-gradient(135deg, #fdfbf7 0%, #f7f1eb 100%);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 16px 0;
      user-select: none;
    }

    button { font: inherit; }

    .shell {
      width: min(1200px, calc(100vw - 36px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: 248px 342px 1fr;
      gap: 24px;
      align-items: center;
    }

    .panel {
      background: var(--neutral);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(40, 6, 5, .09);
    }

    .navigator, .process {
      height: 720px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .navigator { padding: 18px; }
    .process { padding: 22px; }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--primary);
      color: var(--secondary);
      font-weight: 800;
      letter-spacing: -0.5px;
      box-shadow: 0 6px 14px rgba(127, 17, 16, .25);
    }

    .brand strong {
      display: block;
      color: var(--primary);
      font-size: 19px;
      font-weight: 800;
      line-height: 1;
    }

    .brand span {
      display: block;
      color: var(--muted);
      font-size: 9.5px;
      font-weight: 700;
      margin-top: 4px;
      letter-spacing: 0.2px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.22;
      color: var(--accent);
      font-weight: 800;
    }

    .intro {
      margin: 10px 0 14px;
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.55;
    }

    .switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #f8ece7;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 5px;
      margin-bottom: 12px;
    }

    .switcher button {
      border: 0;
      border-radius: 10px;
      padding: 8px 6px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all .2s ease;
    }

    .switcher button.active {
      background: var(--primary);
      color: var(--neutral);
      box-shadow: 0 4px 12px rgba(127, 17, 16, .24);
    }

    /* Steps list without scrolling buttons - native manual touch/drag */
    .steps {
      padding-right: 0;
      overflow-y: auto;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: grab;
    }

    .steps:active { cursor: grabbing; }

    .step-btn {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      display: grid;
      grid-template-columns: 1fr 28px;
      gap: 8px;
      text-align: left;
      align-items: center;
      padding: 9px 10px;
      border-radius: 12px;
      color: var(--accent);
      cursor: pointer;
      transition: background .18s ease, border .18s ease;
    }

    .step-btn:hover { background: #fff8e8; }

    .step-btn.active {
      background: #fffdf8;
      border-color: rgba(127, 17, 16, .28);
      box-shadow: 0 3px 10px rgba(40, 6, 5, .04);
    }

    .step-no {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #f6e8e4;
      color: var(--primary);
      font-size: 11px;
      font-weight: 800;
      grid-column: 2;
      grid-row: 1;
      transition: all .2s ease;
    }

    .step-btn.active .step-no {
      background: var(--secondary);
      color: var(--accent);
      box-shadow: 0 2px 8px rgba(252, 219, 0, .4);
    }

    .step-title {
      font-size: 11px;
      font-weight: 800;
      line-height: 1.25;
      grid-column: 1;
      grid-row: 1;
    }

    .stage {
      display: grid;
      place-items: center;
    }

    /* Modern Phone Frame */
    .phone {
      width: 342px;
      height: 720px;
      border-radius: 38px;
      background: linear-gradient(145deg, #2b0c0a 0%, #170403 100%);
      padding: 9px;
      box-shadow: 0 25px 65px rgba(35, 5, 4, .32), 0 0 0 1px rgba(252, 219, 0, .2) inset;
      position: relative;
    }

    .phone::before {
      content: "";
      position: absolute;
      top: 13px;
      left: 50%;
      transform: translateX(-50%);
      width: 78px;
      height: 5px;
      background: #0f0202;
      border-radius: 999px;
      z-index: 20;
    }

    .screen {
      height: 100%;
      overflow: hidden;
      border-radius: 30px;
      background: var(--neutral);
      position: relative;
      display: flex;
      flex-direction: column;
      touch-action: pan-y;
      cursor: default;
    }

    .status {
      height: 40px;
      padding: 10px 18px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--accent);
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: -0.2px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
    }

    .icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .signal {
      width: 15px;
      height: 9px;
      border-left: 2.5px solid var(--accent);
      border-bottom: 2.5px solid var(--accent);
      transform: skew(-18deg);
    }

    .battery {
      width: 20px;
      height: 10px;
      border: 1.8px solid var(--accent);
      border-radius: 3.5px;
      position: relative;
    }
    .battery::after {
      content: "";
      position: absolute;
      right: -4px;
      top: 2px;
      width: 2.5px;
      height: 3.5px;
      background: var(--accent);
      border-radius: 1px;
    }

    /* Phone content without scrolling buttons - native manual touch/drag */
    .phone-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px 16px 18px;
      opacity: 1;
      transform: translateY(0);
      transition: opacity .18s ease, transform .18s ease;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
      cursor: grab;
      user-select: none;
    }

    .phone-content:active { cursor: grabbing; }

    .phone-content.swap {
      opacity: 0;
      transform: translateY(8px);
    }

    /* Gesture Indicator bar at bottom of mobile screen */
    .gesture-bar {
      position: absolute;
      bottom: 59px;
      left: 50%;
      transform: translateX(-50%);
      width: 38px;
      height: 3px;
      background: rgba(127, 17, 16, .2);
      border-radius: 999px;
      z-index: 18;
      pointer-events: none;
      transition: width .2s ease, background .2s ease;
    }

    .gesture-active .gesture-bar {
      width: 52px;
      background: var(--secondary);
    }

    /* Bottom Navigation with Rich Interactive Icons */
    .bottom-nav {
      height: 60px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-top: 1px solid var(--line-subtle);
      background: rgba(255, 255, 255, .98);
      backdrop-filter: blur(14px);
      z-index: 15;
      padding-bottom: 2px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: #927b78;
      font-size: 9px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.18s ease;
      user-select: none;
      position: relative;
    }

    .nav-item:active {
      transform: scale(0.85);
    }

    .nav-item:hover { color: var(--primary); }

    .nav-item.active {
      color: var(--primary);
      font-weight: 800;
    }

    .nav-icon {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      transition: transform .22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nav-item.active .nav-icon {
      transform: translateY(-2px) scale(1.12);
    }

    .nav-svg {
      width: 22px;
      height: 22px;
      transition: transform .2s ease;
    }

    /* Active Indicator Pill under tab */
    .nav-indicator {
      position: absolute;
      bottom: 2px;
      width: 14px;
      height: 3px;
      border-radius: 999px;
      background: var(--secondary);
      box-shadow: 0 1px 4px rgba(252, 219, 0, 0.6);
      opacity: 0;
      transform: scaleX(0.2);
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nav-item.active .nav-indicator {
      opacity: 1;
      transform: scaleX(1);
    }

    /* App Header */
    .app-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }

    .app-head-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .app-head strong {
      display: block;
      font-size: 14.5px;
      line-height: 1.15;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 800;
    }

    .app-head span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-head-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .round-action {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #fff6d8;
      border: 1px solid #eed9ca;
      color: var(--primary);
      cursor: pointer;
      transition: all .18s ease;
      position: relative;
    }

    .round-action:hover {
      background: #ffeeb0;
      transform: translateY(-1px);
    }

    .round-action:active { transform: scale(0.92); }

    .round-action.has-badge::after {
      content: "";
      position: absolute;
      top: 6px;
      right: 6px;
      width: 7px;
      height: 7px;
      background: #e02424;
      border-radius: 50%;
      border: 1.5px solid #fff6d8;
    }

    /* SVG Icon styles */
    .ico {
      width: 17px;
      height: 17px;
      display: inline-block;
      vertical-align: middle;
    }

    /* Cards & Components */
    .hero-card {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: var(--neutral);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 10px 24px rgba(127, 17, 16, .22);
    }

    .hello {
      font-size: 12.5px;
      opacity: .9;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hero-card h2, .plain h2 {
      margin: 6px 0 8px;
      font-size: 17px;
      line-height: 1.2;
      letter-spacing: -0.2px;
      font-weight: 800;
    }

    .hero-card p, .plain p {
      margin: 0;
      font-size: 9.7px;
      line-height: 1.55;
      color: inherit;
      opacity: .9;
    }

    .cta {
      width: 100%;
      border: 0;
      border-radius: 14px;
      background: var(--secondary);
      color: var(--accent);
      font-weight: 900;
      font-size: 12px;
      padding: 11px 14px;
      margin-top: 10px;
      box-shadow: 0 6px 16px rgba(252, 219, 0, .32);
      cursor: pointer;
      transition: all .18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .cta:hover {
      background: var(--secondary-hover);
      transform: translateY(-1px);
    }

    .cta:active { transform: scale(0.97); }

    .white-cta {
      background: var(--primary);
      color: var(--neutral);
      box-shadow: 0 6px 16px rgba(127, 17, 16, .25);
    }

    .white-cta:hover {
      background: #921413;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0;
    }

    .mini-card, .card {
      background: var(--neutral);
      border: 1px solid var(--line-subtle);
      border-radius: 14px;
      padding: 11px;
      box-shadow: var(--card-shadow);
      transition: border-color .18s ease, transform .18s ease;
    }

    .mini-card strong {
      display: block;
      color: var(--accent);
      font-size: 16px;
      line-height: 1;
      margin-bottom: 5px;
      font-weight: 800;
    }

    .mini-card span, .muted {
      color: var(--muted);
      font-size: 9.5px;
      line-height: 1.45;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 0 8px;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--accent);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      background: var(--secondary);
      color: var(--accent);
      padding: 3.5px 8px;
      font-size: 8.5px;
      font-weight: 900;
      letter-spacing: 0.2px;
    }

    .badge-success {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid rgba(27, 135, 63, .2);
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .chip {
      border-radius: 999px;
      border: 1px solid #ebd8d2;
      padding: 5px 9px;
      font-size: 9px;
      font-weight: 800;
      color: var(--accent);
      background: #fffdf9;
      cursor: pointer;
      transition: all .15s ease;
    }

    .chip:hover {
      background: #fff5e0;
      border-color: #dfbe6b;
    }

    .chip.selected {
      background: var(--secondary);
      border-color: #d1b400;
      color: var(--accent);
    }

    /* Opportunity Card */
    .opportunity {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .opportunity:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .brand-icon-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #fff7e4;
      border: 1px solid #ebd7cd;
      color: var(--primary);
      box-shadow: 0 3px 8px rgba(40, 6, 5, .04);
    }

    .brand-icon-badge svg {
      width: 22px;
      height: 22px;
    }

    .opportunity h3, .card h3 {
      margin: 0 0 4px;
      font-size: 12px;
      line-height: 1.25;
      font-weight: 800;
      color: var(--accent);
    }

    .opportunity p, .card p {
      margin: 0;
      color: var(--muted);
      font-size: 9.5px;
      line-height: 1.45;
    }

    .amount {
      color: var(--primary);
      font-size: 11.5px;
      font-weight: 900;
      white-space: nowrap;
      text-align: right;
    }

    .progress {
      height: 8px;
      background: #f2e2dc;
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0 4px;
    }

    .bar {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary) 0%, #e6a800 100%);
      border-radius: 999px;
      transition: width .4s ease;
    }

    /* Avatar & Profile visual */
    .avatar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .avatar-wrapper {
      position: relative;
      width: 58px;
      height: 58px;
      flex-shrink: 0;
    }

    .avatar-img {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #7F1110 0%, #3e0908 100%);
      color: #fff;
      font-weight: 900;
      font-size: 20px;
      border: 2px solid #fff;
      box-shadow: 0 6px 16px rgba(127, 17, 16, .25);
      overflow: hidden;
    }

    .avatar-img svg {
      width: 36px;
      height: 36px;
    }

    .verified-badge {
      position: absolute;
      bottom: -3px;
      right: -3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--secondary);
      color: var(--accent);
      display: grid;
      place-items: center;
      border: 2px solid #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,.15);
    }

    .verified-badge svg {
      width: 10px;
      height: 10px;
      stroke-width: 3;
    }

    .input {
      background: #fffdf9;
      border: 1px solid #ebd7cd;
      border-radius: 13px;
      padding: 11px 13px;
      margin-bottom: 8px;
      color: var(--accent);
      font-size: 11.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all .15s ease;
    }

    .input:hover {
      border-color: var(--primary);
      background: #fffbf5;
    }

    .social {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--line-subtle);
      border-radius: 14px;
      margin-bottom: 8px;
      background: var(--neutral);
      cursor: pointer;
      transition: all .15s ease;
    }

    .social:hover {
      border-color: var(--primary);
      background: #fffefb;
    }

    .social-icon {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: var(--soft-red);
      color: var(--primary);
      box-shadow: 0 3px 8px rgba(127, 17, 16, .08);
    }

    .social-icon svg {
      width: 20px;
      height: 20px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--success);
      font-size: 10px;
      font-weight: 800;
    }

    /* Video Submission Player Mockup */
    .video-mockup {
      border-radius: 16px;
      background: linear-gradient(180deg, #381211 0%, #1a0504 100%);
      color: #fff;
      overflow: hidden;
      margin-bottom: 10px;
      box-shadow: 0 10px 24px rgba(40, 6, 5, .2);
      border: 1px solid rgba(252, 219, 0, .2);
    }

    .video-thumb {
      height: 120px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      background: radial-gradient(circle at 70% 30%, rgba(252, 219, 0, .25), transparent 60%),
                  linear-gradient(135deg, #501311 0%, #200605 100%);
    }

    .video-play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .22);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, .5);
      display: grid;
      place-items: center;
      color: #fff;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }

    .video-play-btn:hover {
      transform: translate(-50%, -50%) scale(1.08);
      background: rgba(255, 255, 255, .32);
    }

    .video-pill {
      background: rgba(0, 0, 0, .6);
      backdrop-filter: blur(4px);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 800;
      color: #fff;
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .video-caption {
      padding: 10px 12px;
      font-size: 10px;
      line-height: 1.4;
      background: rgba(20, 4, 3, .8);
    }

    .video-caption strong {
      display: block;
      color: #ffd642;
      font-size: 11px;
      margin-bottom: 2px;
    }

    /* Score Ring */
    .score-ring {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 10px auto;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--secondary) 0 92%, #f0dfd9 92% 100%);
      position: relative;
      box-shadow: 0 8px 20px rgba(252, 219, 0, .2);
    }

    .score-ring::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: var(--neutral);
    }

    .score-ring-content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .score-ring-content strong {
      display: block;
      font-size: 30px;
      color: var(--primary);
      line-height: 1;
      font-weight: 800;
    }

    .score-ring-content span {
      display: block;
      font-size: 8px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* Quick Grid */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin: 10px 0;
    }

    .quick {
      min-height: 56px;
      border: 1px solid #ebd7cd;
      background: #fffdf9;
      border-radius: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(40, 6, 5, .04);
      cursor: pointer;
      transition: all .15s ease;
      padding: 6px 2px;
      user-select: none;
    }

    .quick:hover {
      background: #fff8e8;
      border-color: #d8b871;
      transform: translateY(-1px);
    }

    .quick:active { transform: scale(0.93); }

    .quick-icon-box {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--soft-red);
      color: var(--primary);
    }

    .quick-icon-box svg {
      width: 16px;
      height: 16px;
    }

    .quick span {
      color: var(--accent);
      font-size: 8px;
      font-weight: 800;
      line-height: 1.1;
    }

    /* Dense list */
    .dense-list {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }

    .dense-row {
      display: grid;
      grid-template-columns: 32px 1fr auto;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid var(--line-subtle);
      background: #fffdf9;
      cursor: pointer;
      transition: all .15s ease;
    }

    .dense-row:hover {
      border-color: var(--primary);
      background: #fffaf5;
      transform: translateX(2px);
    }

    .dense-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--primary);
      color: var(--secondary);
      font-weight: 800;
    }

    .dense-icon svg {
      width: 17px;
      height: 17px;
    }

    .dense-row strong {
      display: block;
      font-size: 10.5px;
      line-height: 1.2;
      color: var(--accent);
      font-weight: 800;
    }

    .dense-row span {
      display: block;
      color: var(--muted);
      font-size: 8.5px;
      line-height: 1.35;
      margin-top: 1px;
    }

    .dense-value {
      color: var(--primary);
      font-size: 9.5px;
      font-weight: 800;
      white-space: nowrap;
      background: #fbf0ec;
      padding: 3px 7px;
      border-radius: 6px;
    }

    .rail {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin: 8px 0 10px;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .rail::-webkit-scrollbar { display: none; }

    .story {
      min-width: 70px;
      border: 1px solid var(--line-subtle);
      background: #fffdf9;
      border-radius: 14px;
      padding: 8px 6px;
      text-align: center;
      cursor: pointer;
      transition: all .15s ease;
      flex-shrink: 0;
    }

    .story:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .story-icon {
      width: 32px;
      height: 32px;
      margin: 0 auto 5px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--secondary);
      color: var(--accent);
    }

    .story-icon svg {
      width: 17px;
      height: 17px;
    }

    .story span {
      display: block;
      color: var(--accent);
      font-size: 8.5px;
      font-weight: 800;
      line-height: 1.1;
    }

    .tab-strip {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      margin-bottom: 8px;
      scrollbar-width: none;
    }
    .tab-strip::-webkit-scrollbar { display: none; }

    .mini-tab {
      border: 1px solid var(--line-subtle);
      background: #fffdfa;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 9px;
      font-weight: 800;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s ease;
    }

    .mini-tab:hover {
      background: #fff5e0;
      color: var(--accent);
    }

    .mini-tab.active {
      background: var(--primary);
      color: var(--neutral);
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(127, 17, 16, .2);
    }

    .compact-card {
      border: 1px solid var(--line-subtle);
      background: #fffdfa;
      border-radius: 14px;
      padding: 9px 11px;
      margin-top: 8px;
    }

    .compact-card h4 {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 10.5px;
      font-weight: 800;
    }

    .metric-line {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      padding: 3.5px 0;
      border-top: 1px solid rgba(127, 17, 16, .08);
    }

    .metric-line:first-of-type { border-top: 0; }
    .metric-line b { color: var(--accent); font-weight: 800; }

    /* Process sidebar */
    .process h2 {
      margin: 0 0 8px;
      font-size: 19px;
      line-height: 1.2;
      color: var(--accent);
      font-weight: 800;
    }

    .process .summary {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
      margin: 0 0 14px;
    }

    .journey {
      counter-reset: item;
      padding: 0;
      margin: 0;
      list-style: none;
      display: grid;
      gap: 8px;
      overflow-y: auto;
      max-height: 280px;
      scrollbar-width: none;
    }

    .journey li {
      counter-increment: item;
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 10px;
      align-items: start;
      border: 1px solid #ebdcd7;
      background: #fffdfb;
      border-radius: 12px;
      padding: 9px 10px;
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.45;
    }

    .journey li::before {
      content: counter(item);
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--secondary);
      color: var(--accent);
      font-weight: 900;
      font-size: 11px;
    }

    /* System log - Palette synchronized */
    .log {
      margin-top: auto;
      background: linear-gradient(135deg, #2b0b0a 0%, #1d0504 100%);
      color: #ffeec1;
      border-radius: 14px;
      padding: 12px 14px;
      font-family: "JetBrains Mono", monospace;
      font-size: 9.5px;
      line-height: 1.65;
      border: 1px solid rgba(252, 219, 0, .25);
      box-shadow: 0 8px 20px rgba(40, 6, 5, .15);
    }

    .log-title {
      font-family: "Plus Jakarta Sans", sans-serif;
      color: var(--secondary);
      font-weight: 800;
      font-size: 11.5px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .log-line { color: #ffd642; }
    .log-line span { color: #fff6da; }

    /* Interactive Mobile Toast */
    .phone-toast {
      position: absolute;
      top: 48px;
      left: 14px;
      right: 14px;
      background: #280605;
      color: #fff;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 10.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      transform: translateY(-80px);
      opacity: 0;
      transition: all .25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
      pointer-events: none;
      border: 1px solid rgba(252, 219, 0, .3);
    }

    .phone-toast.show {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .toast-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--secondary);
      color: var(--accent);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    /* Interactive Mobile Modal Drawer */
    .phone-drawer {
      position: absolute;
      inset: 0;
      background: rgba(40, 6, 5, .6);
      backdrop-filter: blur(4px);
      z-index: 40;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    .phone-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-body {
      background: #fff;
      border-radius: 24px 24px 0 0;
      padding: 18px 16px 20px;
      transform: translateY(100%);
      transition: transform .25s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 85%;
      overflow-y: auto;
    }

    .phone-drawer.open .drawer-body {
      transform: translateY(0);
    }

    .drawer-handle {
      width: 36px;
      height: 4px;
      background: #dfccc6;
      border-radius: 999px;
      margin: 0 auto 14px;
    }

    .drawer-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
      margin: 0 0 6px;
    }

    .drawer-desc {
      font-size: 10px;
      color: var(--muted);
      margin: 0 0 14px;
      line-height: 1.45;
    }

    .radio-card {
      border: 1.5px solid var(--line-subtle);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all .15s ease;
    }

    .radio-card.active {
      border-color: var(--primary);
      background: #fff8f6;
    }

    .radio-card strong {
      display: block;
      font-size: 11px;
      color: var(--accent);
    }

    .radio-card span {
      display: block;
      font-size: 9px;
      color: var(--muted);
    }

    @media (max-width: 1120px) {
      .shell {
        grid-template-columns: 1fr;
        width: min(760px, calc(100vw - 24px));
      }
      .navigator, .process { height: auto; min-height: 0; }
      .steps { max-height: 280px; }
      .phone { margin: 16px auto; }
    }
  </style>
</head>

  <main class="shell">

    function resolveIcon(key) {
      if (!key) return ICONS.sparkles;
      const k = String(key).toLowerCase().trim();
      
      // Socials
      if (k === "ig" || k === "instagram") return ICONS.instagram;
      if (k === "tt" || k === "tiktok") return ICONS.tiktok;
      if (k === "yt" || k === "youtube") return ICONS.youtube;
      if (k === "x" || k === "twitter") return ICONS.x_twitter;
      if (k === "wa" || k === "whatsapp") return ICONS.whatsapp;
      if (k === "g" || k === "google") return ICONS.google;
      
      // Profiles, Identity & Bio
      if (k === "id" || k === "bio" || k === "user" || k === "role" || k === "pic") return ICONS.user;
      if (k === "tag" || k === "tags" || k === "niche") return ICONS.tag;

      if (k === "preview") return ICONS.search;

      if (k === "rate" || k === "fee" || k === "pay" || k === "bal" || k === "bill" || k === "cost" || k === "dollar" || k === "saldo") return ICONS.dollar;

      if (k === "shot" || k === "draft" || k === "video" || k === "konten") return ICONS.video;

    // Modular components for feature grids, dense rows, tabs, and metrics
    function featureGrid(items) {
      return `
        <div class="quick-grid">
          ${items.map(item => `
            <div class="quick" ${item[2] !== undefined ? `data-go="${item[2]}"` : `onclick="showToast('${item[1]} siap diakses')"`}>
              <div class="quick-icon-box">${resolveIcon(item[0])}</div>
              <span>${item[1]}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function denseRows(items) {
      return `
        <div class="dense-list">
          ${items.map(item => `
            <div class="dense-row" ${item[4] !== undefined ? `data-go="${item[4]}"` : `onclick="showToast('${item[1]}: ${item[2]}')"`}>
              <div class="dense-icon">${resolveIcon(item[0])}</div>
              <div>
                <strong>${item[1]}</strong>
                <span>${item[2]}</span>
              </div>
              <div class="dense-value">${item[3] || "›"}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function tabs(items, active = 0) {
      return `
        <div class="tab-strip">
          ${items.map((item, idx) => `
            <button class="mini-tab ${idx === active ? "active" : ""}" ${item[1] !== undefined ? `data-go="${item[1]}"` : `onclick="selectTab(this, '${item[0]}')"`}>${item[0]}</button>
          `).join("")}
        </div>
      `;
    }

    function selectTab(btn, name) {
      btn.parentElement.querySelectorAll(".mini-tab").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      showToast("Kategori: " + name);
    }

    function metrics(title, items) {
      return `
        <div class="compact-card">
          <h4>${title}</h4>
          ${items.map(item => `
            <div class="metric-line">
              <span>${item[0]}</span>
              <b>${item[1]}</b>
            </div>
          `).join("")}
        </div>
      `;
    }

        <div class="drawer-handle" onclick="closeDrawer()"></div>
        <h3 class="drawer-title">Edit Bio AI Resume</h3>
        <p class="drawer-desc">Sesuaikan positioning diri kamu agar relevan dengan campaign brand impianmu.</p>
        <textarea id="editBioInput" style="width:100%;height:80px;border-radius:12px;border:1px solid #ebd8d2;padding:10px;font-family:inherit;font-size:11px;color:var(--accent);margin-bottom:12px">Rani membuat konten beauty hemat dan daily campus life dengan gaya hangat, jujur, dan mudah diikuti.</textarea>
        <button class="cta white-cta" onclick="saveBio()">
          <span>Simpan Perubahan Bio</span>
        </button>
      `;
      drawerEl.classList.add("open");
    }

    function saveBio() {
      const val = document.getElementById("editBioInput").value;
      const target = document.getElementById("bioText");
      if (target) target.textContent = val;
      closeDrawer();
      showToast("Bio berhasil diperbarui!");
    }

    // Interactive Payout Drawer
    function openPayoutDrawer() {
      drawerBodyEl.innerHTML = `
        <div class="drawer-handle" onclick="closeDrawer()"></div>
        <h3 class="drawer-title">Tarik Saldo ke Rekening</h3>
        <p class="drawer-desc">Pilih rekening tujuan penarikan dana payout BrandxSociety.</p>
        <div class="radio-card active" onclick="selectBank(this)">
          <div>
            <strong>BCA (Bank Central Asia)</strong>
            <span>8291 •••• •••• - Rani Putri Lestari</span>
          </div>
          <span style="color:var(--primary)">${ICONS.check_circle}</span>
        </div>
        <div class="radio-card" onclick="selectBank(this)">
          <div>
            <strong>Bank Mandiri</strong>
            <span>1310 •••• •••• - Rani Putri Lestari</span>
          </div>
          <span style="color:var(--muted)">${ICONS.building}</span>
        </div>
        <div class="radio-card" onclick="selectBank(this)">
          <div>
            <strong>GoPay Creator Wallet</strong>
            <span>0812 •••• 9831</span>
          </div>
          <span style="color:var(--muted)">${ICONS.wallet}</span>
        </div>
        <div style="background:#fff9e6;border:1px solid #ebd67e;padding:9px 12px;border-radius:10px;margin:10px 0;font-size:9.5px;color:#854d0e">
          <strong>Biaya Admin: Rp0 (Promo Bebas Biaya)</strong><br>
          Estimasi dana masuk: Instant (1-5 menit).
        </div>
        <button class="cta" onclick="confirmWithdraw()">
          <span>Konfirmasi Tarik Rp1.450.000</span>
        </button>
      `;
      drawerEl.classList.add("open");
    }

    function selectBank(card) {
      document.querySelectorAll(".radio-card").forEach(c => c.classList.remove("active"));
      card.classList.add("active");
    }

    function confirmWithdraw() {
      closeDrawer();
      const balEl = document.getElementById("creatorBalance");
      if (balEl) balEl.textContent = "Rp0";
      showToast("Penarikan Rp1.450.000 ke BCA berhasil dikirim!", ICONS.check_circle);
    }

    // Interactive Notification Drawer
    function openNotifications() {
      drawerBodyEl.innerHTML = `
        <div class="drawer-handle" onclick="closeDrawer()"></div>
        <h3 class="drawer-title">Notifikasi Terkini</h3>
        <p class="drawer-desc">Aktivitas dan pembaruan campaign akun kamu.</p>
        <div class="social" style="margin-bottom:6px">
          <div class="social-icon" style="background:#eafaf1;color:#1b873f">${ICONS.check}</div>
          <div><strong>GlowDaily menyetujui draft kamu</strong><p class="muted">Payout Rp850.000 telah dirilis ke saldo</p></div>
        </div>
        <div class="social" style="margin-bottom:6px">
          <div class="social-icon" style="background:#fff3d0;color:#996515">${ICONS.sparkles}</div>
          <div><strong>Match baru: Kopi Sore</strong><p class="muted">Komisi 15% untuk nano creator kampus</p></div>
        </div>
        <div class="social">
          <div class="social-icon" style="background:#f0e5fc;color:#6b21a8">${ICONS.chart}</div>
          <div><strong>Creator score naik ke 94</strong><p class="muted">Karena menyelesaikan submission tepat waktu</p></div>
        </div>
        <button class="cta white-cta" style="margin-top:10px" onclick="closeDrawer()">Tutup</button>
      `;
      drawerEl.classList.add("open");
    }

    function closeDrawer() {
      drawerEl.classList.remove("open");
    }

    drawerEl.addEventListener("click", e => {
      if (e.target === drawerEl) closeDrawer();
    });

    // RENDER STEPS IN LEFT NAVIGATOR
    function renderSteps() {
      stepsEl.innerHTML = currentData().map((step, index) => `
        <button class="step-btn ${index === state.index ? "active" : ""}" data-index="${index}">
          <span class="step-no">${index + 1}</span>
          <span class="step-title">${step.title}</span>
        </button>
      `).join("");
    }

    // RENDER MOBILE PHONE SCREEN
    function renderPhone(step) {
      phoneEl.classList.add("swap");
      window.setTimeout(() => {
        // App header with Back button & Notification bell
        const hasBack = state.index > 0;
        const appHeaderHtml = `
          <div class="app-head">
            <div class="app-head-left">
              ${hasBack ? `
                <div class="round-action" onclick="goBack()" title="Kembali">
                  ${ICONS.back}
                </div>
              ` : ""}
              <div style="min-width:0">
                <strong>${state.flow === "people" ? (state.index < 2 ? "Hi, Rani" : "Rani's Creator Hub") : "GlowDaily Studio"}</strong>
                <span>${step.title}</span>
              </div>
            </div>
            <div class="app-head-actions">
              <div class="round-action has-badge" onclick="openNotifications()" title="Notifikasi">
                ${ICONS.bell}
              </div>
            </div>
          </div>
        `;

        // Render main content combined with rich interactive modules
        const moduleHtml = state.flow === "people" 
          ? (peopleModules[state.index] ? peopleModules[state.index]() : "") 
          : (brandModules[state.index] ? brandModules[state.index]() : "");

        phoneEl.innerHTML = appHeaderHtml + step.html + moduleHtml;

        // Render bottom navigation with completely distinct signature icons & active indicators
        navEl.innerHTML = navs.map(item => {
          const isActive = item === step.nav;
          return `
            <div class="nav-item ${isActive ? "active" : ""}" data-go="${navTargets[state.flow][item]}">
              <span class="nav-icon">${resolveNavIcon(item, isActive)}</span>
              <span>${item}</span>
              <span class="nav-indicator"></span>
            </div>
          `;
        }).join("");

        phoneEl.scrollTop = 0;
        phoneEl.classList.remove("swap");
      }, 140);
    }

    function goBack() {
      if (state.index > 0) {
        goToTarget(state.index - 1);
      }
    }

    function goToTarget(rawTarget) {
      if (rawTarget === undefined || rawTarget === null || rawTarget === "") return;
      const target = String(rawTarget);
      if (target.includes(":")) {
        const [flow, idx] = target.split(":");
        state.flow = flow;
        state.index = Number(idx);
        document.querySelectorAll(".switcher button").forEach(item => item.classList.toggle("active", item.dataset.flow === flow));
      } else {
        state.index = Math.max(0, Math.min(Number(target), currentData().length - 1));
      }
      render();
    }

    // RENDER RIGHT PROCESS & LOG
    function renderProcess(step) {
      titleEl.textContent = step.title;
      summaryEl.textContent = step.summary;
      journeyEl.innerHTML = step.parts.map(part => `<li>${part}</li>`).join("");
      logEl.innerHTML = step.logs.map(line => {
        const time = line.slice(0, 7);
        const text = line.slice(8);
        return `<div class="log-line">${time} <span>${text}</span></div>`;
      }).join("");
    }

    function render() {
      const step = currentData()[state.index];
      renderSteps();
      renderPhone(step);
      renderProcess(step);
    }

    // Flow Switcher (People / Brand)
    document.querySelectorAll(".switcher button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".switcher button").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        state.flow = button.dataset.flow;
        state.index = 0;
        render();
        showToast("Beralih ke " + (state.flow === "people" ? "People Demo" : "Brand Demo"));
      });
    });

    // Left Navigator Click
    stepsEl.addEventListener("click", event => {
      const button = event.target.closest(".step-btn");
      if (!button) return;
      state.index = Number(button.dataset.index);
      render();
    });

    // Mobile Phone Screen Interactive Delegations
    document.querySelector(".screen").addEventListener("click", event => {
      const target = event.target.closest("[data-go]");
      if (!target) return;
      goToTarget(target.dataset.go);
    });

    // ==========================================
    // DIRECT TOUCH & MOUSE SWIPE / DRAG GESTURES
    // (Native App Experience without scroll buttons)
    // ==========================================

    function setupNativeGestures() {
      // 1. Phone Screen Horizontal Swipe & Vertical Drag
      let startX = 0;
      let startY = 0;
      let isDraggingPhone = false;
      let phoneScrollTopStart = 0;
      let isHorizontalSwipe = false;

      phoneEl.addEventListener("mousedown", e => {
        if (e.target.closest("button") || e.target.closest(".cta") || e.target.closest(".quick") || e.target.closest(".dense-row") || e.target.closest(".input") || e.target.closest(".chip") || e.target.closest(".round-action") || e.target.closest(".video-play-btn")) {
          // allow button clicks normally
        }
        isDraggingPhone = true;
        startX = e.clientX;
        startY = e.clientY;
        phoneScrollTopStart = phoneEl.scrollTop;
        isHorizontalSwipe = false;
      });

      window.addEventListener("mousemove", e => {
        if (!isDraggingPhone) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        // If dragging more horizontally, indicate horizontal swipe
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 12) {
          isHorizontalSwipe = true;
          phoneScreenEl.classList.add("gesture-active");
        } else if (!isHorizontalSwipe) {
          // Drag vertical scroll inside phone content
          phoneEl.scrollTop = phoneScrollTopStart - dy;
        }
      });

      window.addEventListener("mouseup", e => {
        if (!isDraggingPhone) return;
        isDraggingPhone = false;
        phoneScreenEl.classList.remove("gesture-active");

        const dx = e.clientX - startX;
        if (isHorizontalSwipe && Math.abs(dx) > 42) {
          if (dx < -42) {
            // Swiped left -> next screen
            if (state.index < currentData().length - 1) {
              goToTarget(state.index + 1);
              showToast("Swipe: " + currentData()[state.index].title);
            }
          } else if (dx > 42) {
            // Swiped right -> previous screen
            if (state.index > 0) {
              goToTarget(state.index - 1);
              showToast("Swipe: " + currentData()[state.index].title);
            }
          }
        }
      });

      // Touch Events for Mobile / Touchscreen
      phoneEl.addEventListener("touchstart", e => {
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        phoneScrollTopStart = phoneEl.scrollTop;
        isHorizontalSwipe = false;
      }, { passive: true });

      phoneEl.addEventListener("touchmove", e => {
        const touch = e.touches[0];
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;

        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 15) {
          isHorizontalSwipe = true;
          phoneScreenEl.classList.add("gesture-active");
        } else {
          phoneScreenEl.classList.remove("gesture-active");
        }
      }, { passive: true });

      phoneEl.addEventListener("touchend", e => {
        phoneScreenEl.classList.remove("gesture-active");
        if (isHorizontalSwipe) {
          const touch = e.changedTouches[0];
          const dx = touch.clientX - startX;
          if (dx < -45 && state.index < currentData().length - 1) {
            goToTarget(state.index + 1);
          } else if (dx > 45 && state.index > 0) {
            goToTarget(state.index - 1);
          }
        }
      });

      // 2. Left Navigator Steps List Drag-to-Scroll
      let isDraggingSteps = false;
      let stepsStartY = 0;
      let stepsScrollTopStart = 0;

      stepsEl.addEventListener("mousedown", e => {
        isDraggingSteps = true;
        stepsStartY = e.clientY;
        stepsScrollTopStart = stepsEl.scrollTop;
      });

      window.addEventListener("mousemove", e => {
        if (!isDraggingSteps) return;
        const dy = e.clientY - stepsStartY;
        stepsEl.scrollTop = stepsScrollTopStart - dy;
      });

      window.addEventListener("mouseup", () => {
        isDraggingSteps = false;
      });
    }

    // Initialize UI & Gestures
    render();
    setupNativeGestures();
  </script>
</body>
</html>
